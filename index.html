<style>
  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --border: #E8E4DC;
    --text: #1A1814;
    --text-2: #6B6560;
    --text-3: #A8A39C;
    --accent: #C4973A;
    --green: #3B6D11;
    --green-bg: #EAF3DE;
    --orange: #854F0B;
    --orange-bg: #FAEEDA;
    --blue: #185FA5;
    --blue-bg: #E6F1FB;
    --red: #A32D2D;
    --red-bg: #FCEBEB;
    --purple: #534AB7;
    --purple-bg: #EEEDFE;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

  /* Layout */
  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); padding: 24px 0; position: fixed; top: 0; left: 0; height: 100vh; display: flex; flex-direction: column; z-index: 10; }
  .sidebar-logo { padding: 0 20px 24px; border-bottom: 1px solid var(--border); }
  .sidebar-logo h1 { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--text); line-height: 1.2; }
  .sidebar-logo span { font-size: 11px; color: var(--text-3); letter-spacing: .5px; text-transform: uppercase; }
  .sidebar-nav { padding: 16px 12px; flex: 1; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm); font-size: 13px; color: var(--text-2); cursor: pointer; transition: all .15s; margin-bottom: 2px; }
  .nav-item:hover, .nav-item.active { background: var(--bg); color: var(--text); }
  .nav-item.active { font-weight: 500; }
  .nav-icon { width: 16px; text-align: center; }
  .sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
  .db-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-3); }
  .db-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .db-dot.err { background: var(--red); }
  .main { margin-left: 220px; padding: 32px; min-height: 100vh; }

  /* Header */
  .page-header { margin-bottom: 28px; }
  .page-header h2 { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--text); margin-bottom: 4px; }
  .page-header p { font-size: 13px; color: var(--text-3); }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .stat-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .stat-value { font-size: 26px; font-weight: 600; color: var(--text); }
  .stat-value.green { color: var(--green); }
  .stat-value.orange { color: var(--orange); }
  .stat-value.blue { color: var(--blue); }
  .stat-value.accent { font-size: 18px; color: var(--accent); }

  /* Toolbar */
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; }
  .search-wrap { flex: 1; position: relative; }
  .search-wrap input { width: 100%; padding: 9px 12px 9px 36px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit; outline: none; transition: border-color .15s; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 13px; }
  .filter-select { padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; outline: none; }
  .btn-primary { padding: 9px 18px; background: var(--text); color: white; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer; white-space: nowrap; transition: opacity .15s; }
  .btn-primary:hover { opacity: .85; }

  /* Table */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .count-line { font-size: 12px; color: var(--text-3); margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead { background: var(--bg); }
  th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border); }
  td { padding: 12px 14px; border-bottom: 1px solid var(--border); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--bg); cursor: pointer; }
  .price-cell { font-weight: 600; }

  /* Badges */
  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 500; }
  .b-Vacía { background: var(--green-bg); color: var(--green); }
  .b-Alquilada { background: var(--orange-bg); color: var(--orange); }
  .b-Habitada { background: var(--blue-bg); color: var(--blue); }
  .b-Departamento { background: var(--purple-bg); color: var(--purple); }
  .b-Casa { background: var(--blue-bg); color: var(--blue); }
  .b-Cochera { background: var(--green-bg); color: var(--green); }
  .b-Baulera { background: #F1EFE8; color: #5F5E5A; }
  .b-Oficina { background: #FEF3E2; color: #92400E; }
  .b-Otro { background: var(--red-bg); color: var(--red); }

  /* Row actions */
  .row-act { display: flex; gap: 6px; }
  .btn-sm { padding: 4px 10px; font-size: 11px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--text-2); cursor: pointer; font-family: inherit; transition: all .15s; }
  .btn-sm:hover { background: var(--bg); color: var(--text); }
  .btn-del:hover { background: var(--red-bg); color: var(--red); border-color: #F09595; }

  /* Detail / Form panel */
  .panel { position: fixed; top: 0; right: -100%; width: 480px; height: 100vh; background: var(--surface); border-left: 1px solid var(--border); z-index: 100; transition: right .25s ease; overflow-y: auto; display: flex; flex-direction: column; }
  .panel.open { right: 0; }
  .panel-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.2); z-index: 99; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .panel-overlay.open { opacity: 1; pointer-events: all; }
  .panel-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .panel-title { font-family: 'DM Serif Display', serif; font-size: 18px; }
  .btn-close { padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; cursor: pointer; font-size: 16px; color: var(--text-2); }
  .btn-close:hover { background: var(--bg); }
  .panel-body { padding: 24px; flex: 1; }

  /* Detail view */
  .detail-price { font-family: 'DM Serif Display', serif; font-size: 28px; color: var(--text); margin-bottom: 4px; }
  .detail-price small { font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text-3); font-weight: 400; }
  .detail-badges { display: flex; gap: 8px; margin: 12px 0 20px; }
  .detail-address { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
  .detail-sub { font-size: 13px; color: var(--text-2); margin-bottom: 16px; }
  .detail-divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .dg { background: var(--bg); border-radius: var(--radius-sm); padding: 10px 12px; }
  .dg-l { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
  .dg-v { font-size: 14px; font-weight: 500; }
  .section-label { font-size: 11px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
  .obs-box { background: var(--bg); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13px; line-height: 1.7; color: var(--text-2); }
  .inq-card { background: var(--bg); border-radius: var(--radius-sm); padding: 14px; }
  .inq-name { font-weight: 600; margin-bottom: 8px; font-size: 14px; }
  .inq-row { font-size: 13px; color: var(--text-2); margin-bottom: 4px; }
  .detail-actions { display: flex; gap: 10px; padding: 20px 24px; border-top: 1px solid var(--border); background: var(--surface); position: sticky; bottom: 0; flex-wrap: wrap; }
  .btn-secondary { padding: 9px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; }
  .btn-danger { padding: 9px 16px; border: 1px solid #F09595; border-radius: var(--radius-sm); background: transparent; color: var(--red); font-size: 13px; font-family: inherit; cursor: pointer; }
  .btn-danger:hover { background: var(--red-bg); }

  /* btn-pdf: accent-outlined button */
  .btn-pdf { padding: 9px 16px; border: 1px solid var(--accent); border-radius: var(--radius-sm); background: transparent; color: var(--accent); font-size: 13px; font-family: inherit; cursor: pointer; transition: all .15s; white-space: nowrap; }
  .btn-pdf:hover { background: #FBF4E6; }
  .btn-pdf:disabled { opacity: .5; cursor: default; }

  /* Form */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-field { display: flex; flex-direction: column; gap: 5px; }
  .form-field.full { grid-column: 1/-1; }
  .form-field label { font-size: 11px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: .4px; }
  .form-field input, .form-field select, .form-field textarea { padding: 9px 11px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit; outline: none; transition: border-color .15s; }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--accent); }
  .form-field textarea { resize: vertical; min-height: 70px; line-height: 1.6; }
  .form-section { font-size: 11px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: .4px; grid-column: 1/-1; padding-top: 6px; border-top: 1px solid var(--border); margin-top: 4px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 20px 24px; border-top: 1px solid var(--border); background: var(--surface); position: sticky; bottom: 0; }

  /* Loading / Empty */
  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; gap: 14px; color: var(--text-3); }
  .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-3); }
  .empty-state p { font-size: 13px; margin-top: 8px; }

  /* Alerts */
  .alert-section { margin-bottom: 24px; }
  .alert-section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .alert-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background .15s; }
  .alert-card:hover { background: var(--bg); }
  .alert-card.urgent { border-left: 3px solid var(--red); }
  .alert-card.warning { border-left: 3px solid var(--accent); }
  .alert-info { flex: 1; }
  .alert-dir { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
  .alert-meta { font-size: 12px; color: var(--text-2); }

  .alert-days-num { font-size: 22px; font-weight: 600; }
  .alert-days-num.urgent { color: var(--red); }
  .alert-days-num.warning { color: var(--accent); }

  .no-alerts { text-align: center; padding: 60px 20px; color: var(--text-3); font-size: 14px; }
  .no-alerts-icon { font-size: 40px; margin-bottom: 12px; }
  /* Groups */
  .group-section { margin-bottom: 28px; }
  .group-header { display: flex; align-items: center; gap: 9px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; border-bottom: 2px solid var(--border); }

  .login-wrap { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 999; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px 36px; width: 340px; text-align: center; }
  .login-logo { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--text); margin-bottom: 4px; }
  .login-sub { font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 28px; }
  .login-field { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; background: var(--bg); color: var(--text); outline: none; margin-bottom: 12px; text-align: center; letter-spacing: 2px; }
  .login-field:focus { border-color: var(--accent); }
  .login-btn { width: 100%; padding: 11px; background: var(--text); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer; transition: opacity .15s; }
  .login-btn:hover { opacity: .85; }
  .login-error { font-size: 12px; color: var(--red); margin-top: 8px; min-height: 18px; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--text); color: white; padding: 10px 20px; border-radius: var(--radius-sm); font-size: 13px; opacity: 0; transition: all .2s; pointer-events: none; z-index: 9999; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

// fichaPropiedad: abre nueva ventana con ficha estilo MAO Propiedades
async function fichaPropiedad(propId) {
  const p = props.find(x => x.id === propId);
  if (!p) return;
  const btn = document.getElementById('btn-ficha-' + propId);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Cargando...'; }
  showToast('Preparando ficha...');
  let fotos = [];
  try {
    const { data } = await db.storage.from('propiedades-fotos').list('prop-' + propId + '/');
    fotos = (data || [])
      .filter(function(f){ return f.name && f.name !== '.emptyFolderPlaceholder'; })
      .map(function(f){ return db.storage.from('propiedades-fotos').getPublicUrl('prop-' + propId + '/' + f.name).data.publicUrl; });
  } catch(e) {}
  const win = window.open('', '_blank');
  if (!win) { showToast('Permití popups para abrir la ficha'); if(btn){btn.disabled=false;btn.textContent='📄 Ver ficha';} return; }
  win.document.write(generarFichaHTML(p, fotos));
  win.document.close();
  if (btn) { btn.disabled = false; btn.textContent = '📄 Ver ficha'; }
}

async function fetchICL(){
  try {
    const res = await fetch("https://api.bcra.gob.ar/estadisticas/v3.0/monetarias/14/datos?limit=2", {
      headers: {"Accept": "application/json"}
    });
    if(!res.ok) throw new Error("Sin respuesta");
    const data = await res.json();
    const registros = data.results || data.data || [];
    if(registros.length < 2) throw new Error("Datos insuficientes");
    const ultimo = registros[0].valor || registros[0].v;
    const anterior = registros[1].valor || registros[1].v;
    return { icl: (ultimo / anterior), fecha: registros[0].fecha || registros[0].d, raw: { ultimo, anterior } };
  } catch(e) {
    return null;
  }
}

function getAjustesHoy(){
  const hoy = new Date();
  const dd = String(hoy.getDate()).padStart(2,"0");
  const mm = String(hoy.getMonth()+1).padStart(2,"0");
  return props.filter(p => {
    if(!p.alquilado || !p.ajuste || !p.ini_contrato) return false;
    const ajuste = p.ajuste.toLowerCase();
    if(!ajuste.includes("icl") && !ajuste.includes("cuatrimestral") && !ajuste.includes("trimestral") && !ajuste.includes("semestral")) return false;
    const [dIni, mIni] = p.ini_contrato.split("/");
    const diaAjuste = dIni;
    if(dd !== diaAjuste) return false;
    const mesActual = hoy.getMonth()+1;
    const mesInicio = parseInt(mIni);
    const diff = (mesActual - mesInicio + 12) % 12;
    if(ajuste.includes("cuatrimestral")) return diff % 4 === 0 && diff > 0;
    if(ajuste.includes("trimestral")) return diff % 3 === 0 && diff > 0;
    if(ajuste.includes("semestral")) return diff % 6 === 0 && diff > 0;
    return false;
  });
}

function previewICL(propData){
  const icl = parseFloat(document.getElementById("icl-manual")?.value);
  const preview = document.getElementById("icl-preview");
  const btn = document.getElementById("btn-aplicar-icl");
  if(!icl || icl <= 0){
    if(preview) preview.innerHTML = "";
    if(btn){ btn.disabled = true; btn.style.opacity = ".4"; }
    return;
  }
  const html = propData.map(p => {
    const nuevo = Math.round(p.alq * icl);
    const diff = nuevo - p.alq;
    return `<div style="background:var(--bg);border-radius:6px;padding:9px 12px;margin-bottom:6px;font-size:12px">
      <span style="color:var(--text-2)">$${Number(p.alq).toLocaleString("es-AR")}</span>
      <span style="margin:0 6px;color:var(--text-3)">→</span>
      <strong style="color:var(--green)">$${nuevo.toLocaleString("es-AR")}</strong>
      <span style="color:var(--text-3);margin-left:6px">(+$${diff.toLocaleString("es-AR")})</span>
    </div>`;
  }).join("");
  if(preview) preview.innerHTML = html;
  if(btn){ btn.disabled = false; btn.style.opacity = "1"; btn.dataset.icl = icl; }
}

async function aplicarICLManual(ids){
  const btn = document.getElementById("btn-aplicar-icl");
  const icl = parseFloat(btn?.dataset.icl);
  if(!icl) return;
  if(!confirm(`¿Aplicar ajuste ICL ${icl} a ${ids.length} propiedad${ids.length!==1?"es":""}?`)) return;
  document.querySelector("div[style*='position:fixed'][style*='z-index:999']")?.remove();
  await aplicarTodosAjustes(ids, icl);
}

async function aplicarTodosAjustes(ids, icl){
  document.querySelector("div[style*='position:fixed'][style*='z-index:999']")?.remove();
  let aplicados = 0;
  for(const id of ids){
    const p = props.find(x => x.id === id);
    if(!p) continue;
    const nuevoValor = Math.round(p.alq_mensual * icl);
    await db.from("propiedades").update({alq_mensual: nuevoValor}).eq("id", id);
    await db.from("historial_precios").insert({
      propiedad_id: id, tipo_precio: "alquiler",
      valor_anterior: p.alq_mensual, valor_nuevo: nuevoValor
    });
    aplicados++;
  }
  const { data: fresh } = await db.from("propiedades").select("*").order("id");
  if(fresh) props = fresh;
  showToast(`${aplicados} alquiler${aplicados!==1?"es":""} actualizado${aplicados!==1?"s":""} ✓`);
  renderMain();
}

async function init(){
  db = supabase.createClient(SUPA_URL, SUPA_KEY);
  try {
    const { data, error } = await db.from("propiedades").select("*").order("id");
    if(error) throw error;
    if(data.length === 0){
      document.getElementById("main").innerHTML = '<div class="loading"><div class="spinner"></div><span>Cargando 26 propiedades por primera vez...</span></div>';
      const { error: e2 } = await db.from("propiedades").insert(SEED);
      if(e2) throw e2;
      const { data: d2 } = await db.from("propiedades").select("*").order("id");
      props = d2;
    } else { props = data; }
    document.getElementById("db-dot").className = "db-dot";
    document.getElementById("db-label").textContent = "Supabase conectado";
    updateAlertBadge();
    if(currentUser && currentUser.rol === 'alquileres'){
      currentView = 'gestion';
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const ng = document.getElementById('nav-gestion');
      if(ng) ng.classList.add('active');
      loadGestion();
    } else {
      renderMain();
    }
    checkAjustesAutomaticos();
  } catch(e) {
    document.getElementById("db-dot").className = "db-dot err";
    document.getElementById("db-label").textContent = "Error de conexión";
    document.getElementById("main").innerHTML = `<div class="loading"><span style="color:var(--red)">❌ ${e.message}</span></div>`;
  }
}

function setView(v){
  currentView = v;
  document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
  event.target.closest(".nav-item").classList.add("active");
  if(v === "alertas"){
    document.getElementById("main").innerHTML = renderAlertas();
  } else if(v === "resumen"){
    loadResumen();
  } else if(v === "gestion"){
    loadGestion();
  } else if(v === "vendidas"){
    renderMain();
  } else {
    renderMain();
  }
}

const SIT_ORDER = {"Vacía":0,"Habitada":1,"Alquilada":2};

function parseFecha(str){
  if(!str) return Infinity;
  const parts = str.split("/");
  if(parts.length !== 3) return Infinity;
  return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`).getTime() || Infinity;
}

function filtered(){
  let list = currentView === "alquiladas" ? props.filter(p => p.alquilado && !p.vendida)
           : currentView === "vendidas"   ? props.filter(p => p.vendida)
           : props.filter(p => !p.vendida);

  if(currentUser && currentUser.rol === "ventas"){
    if(currentView === "alquiladas"){
      list = list.filter(p => p.precio > 0);
    }
  } else if(currentUser && currentUser.rol === "alquileres"){
    list = props.filter(p => p.alquilado);
  }

  return list.filter(p => {
    const s = search.toLowerCase();
    const ms = !s || (p.direccion + p.barrio + (p.inquilino||"") + (p.observaciones||"")).toLowerCase().includes(s);
    return ms && (!fTipo || p.tipo === fTipo) && (!fSit || p.situacion === fSit);
  }).sort((a,b) => {
    const sitDiff = (SIT_ORDER[a.situacion]??9) - (SIT_ORDER[b.situacion]??9);
    if(sitDiff !== 0) return sitDiff;
    return parseFecha(a.fin_contrato) - parseFecha(b.fin_contrato);
  });
}

function getAlertas(){
  const now = Date.now();
  const day = 86400000;
  return props
    .filter(p => p.alquilado && p.fin_contrato)
    .map(p => {
      const fin = parseFecha(p.fin_contrato);
      const dias = Math.round((fin - now) / day);
      return {...p, diasRestantes: dias};
    })
    .filter(p => p.diasRestantes <= 60 && p.diasRestantes >= 0)
    .sort((a,b) => a.diasRestantes - b.diasRestantes);
}

function updateAlertBadge(){
  const alertas = getAlertas();
  const badge = document.getElementById("alert-count");
  if(!badge) return;
  if(alertas.length > 0){
    badge.textContent = alertas.length;
    badge.style.display = "inline";
  } else {
    badge.style.display = "none";
  }
}

function parseDireccion(dir){
  const sep = dir.includes(", ") ? [dir.indexOf(", "), 2] : dir.includes(" - ") ? [dir.indexOf(" - "), 3] : null;
  if(!sep) return { domicilio: dir, unidad: "" };
  return { domicilio: dir.substring(0, sep[0]), unidad: dir.substring(sep[0] + sep[1]) };
}

function renderPropRow(p, isAlq){

function renderGroups(list){
  const isPriority = p => PRIORITARIOS.some(d => p.direccion.includes(d) || d.includes(p.direccion.trim()));
  const groups = [
    { key:"priority", icon:"📌", label:"Prioritarios", extra:"group-priority", items: list.filter(p => isPriority(p)).sort((a,b) => {
        const ia = PRIORITARIOS.findIndex(d => a.direccion.includes(d) || d.includes(a.direccion.trim()));
        const ib = PRIORITARIOS.findIndex(d => b.direccion.includes(d) || d.includes(b.direccion.trim()));
        return ia - ib;
      }) },
    { key:"d1", icon:"🛏", label:"1 Dormitorio",  items: list.filter(p => p.dormitorios === 1 && (p.tipo==="Departamento"||p.tipo==="Casa") && !isPriority(p)) },
    { key:"d2", icon:"🛏", label:"2 Dormitorios", items: list.filter(p => p.dormitorios === 2 && (p.tipo==="Departamento"||p.tipo==="Casa") && !isPriority(p)) },
    { key:"d3", icon:"🛏", label:"3 Dormitorios", items: list.filter(p => p.dormitorios >= 3 && (p.tipo==="Departamento"||p.tipo==="Casa") && !isPriority(p)) },
    { key:"of", icon:"🏢", label:"Oficinas",   items: list.filter(p => p.tipo==="Oficina" && !isPriority(p)) },
    { key:"co", icon:"🚗", label:"Cocheras",   items: list.filter(p => p.tipo==="Cochera" && !isPriority(p)) },
    { key:"ba", icon:"📦", label:"Bauleras",   items: list.filter(p => p.tipo==="Baulera" && !isPriority(p)) },
  ];
  const asignados = new Set(groups.flatMap(g => g.items.map(p => p.id)));
  const otros = list.filter(p => !asignados.has(p.id));
  if(otros.length > 0) groups.push({ key:"otros", icon:"🏠", label:"Otros", items: otros });
  return groups.filter(g => g.items.length > 0).map(g => `
    <div class="group-section ${g.extra||""}">
      <div class="group-header">
        <span>${g.icon}</span>
        <span class="group-title">${g.label}</span>
        <span class="group-count">${g.items.length}</span>
      </div>
      ${renderPropTable(g.items, false)}
    </div>`).join("");
}

async function subirDocumento(event, propId){
  const file = event.target.files[0];
  if(!file) return;
  const tipo = document.getElementById(`doc-tipo-${propId}`)?.value || "Documento";
  const status = document.getElementById(`doc-status-${propId}`);
  if(status) status.textContent = "Subiendo...";

  const nombre = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
  const path = `prop-${propId}/${nombre}`;
  const { error: upErr } = await db.storage.from("propiedades-docs").upload(path, file);
  if(upErr){ if(status) status.textContent = "Error al subir"; return; }
  const { data: urlData } = db.storage.from("propiedades-docs").getPublicUrl(path);

  let notas = "";
  if(tipo === "Liquidación de expensas" && file.type === "application/pdf"){
    if(status) status.textContent = "Procesando con IA...";
    try {
      const base64 = await fileToBase64(file);
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: [
              { type: "document", source: { type: "base64", media_type: "application/pdf", data: base64 }},
              { type: "text", text: `Analizá esta liquidación de expensas argentina. Respondé SOLO con JSON sin backticks ni explicaciones:
{"importe_total": número, "fecha_vencimiento": "DD/MM/AAAA o null", "periodo": "mes año", "conceptos": [{"nombre": "string", "importe": número}]}` }
            ]
          }]
        })
      });
      const data = await response.json();
      const text = data.content?.find(c => c.type === "text")?.text || "";
      const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
      notas = JSON.stringify(parsed);
      if(parsed.importe_total > 0){
        await db.from("propiedades").update({expensas: parsed.importe_total}).eq("id", propId);
        const { data: fresh } = await db.from("propiedades").select("*").order("id");
        if(fresh) props = fresh;
        showToast(`Expensas actualizadas: $${parsed.importe_total.toLocaleString("es-AR")} ✓`);
      }
    } catch(e){ notas = ""; }
  }

  await db.from("documentos").insert({ propiedad_id: propId, tipo, nombre: file.name, url: urlData.publicUrl, notas });
  if(status){ status.textContent = "Guardado ✓"; setTimeout(()=>status.textContent="",2500); }
  cargarDocumentos(propId);
}

function fileToBase64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = () => rej(new Error("Error leyendo archivo"));
    r.readAsDataURL(file);
  });
}

async function cargarFotos(propId){
  const section = document.getElementById(`fotos-section-${propId}`);

  try {
    const { data, error } = await db.storage.from("propiedades-fotos").list(`prop-${propId}/`);

    const fotos = data.filter(f => f.name && f.name !== ".emptyFolderPlaceholder");
    if(fotos.length === 0){ section.innerHTML = ""; return; }
    const urls = fotos.map(f => {
      const { data: urlData } = db.storage.from("propiedades-fotos").getPublicUrl(`prop-${propId}/${f.name}`);
      return { url: urlData.publicUrl, name: f.name };
    });
    section.innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px">
        ${urls.map(f => `
          <div style="position:relative;aspect-ratio:4/3">

            <button onclick="eliminarFoto(${propId},'${f.name}')" style="position:absolute;top:3px;right:3px;background:rgba(0,0,0,.5);color:white;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;line-height:1">✕</button>
          </div>`).join("")}

async function subirFotos(event, propId){
  const files = event.target.files;
  if(!files || files.length === 0) return;
  const status = document.getElementById(`fotos-status-${propId}`);
  if(status) status.textContent = "Subiendo...";
  for(const file of files){
    const nombre = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.]/g,"_")}`;
    await db.storage.from("propiedades-fotos").upload(`prop-${propId}/${nombre}`, file);
  }
  if(status) status.textContent = `${files.length} foto${files.length!==1?"s":""} subida${files.length!==1?"s":""}`;
  setTimeout(() => { if(status) status.textContent = ""; }, 2000);
  cargarFotos(propId);
}

async function saveProp(){
  const dir = g("f-dir"); const precio = g("f-precio");
  if(!dir || !precio){ alert("Dirección y precio son obligatorios."); return; }
  const sit = g("sit-select") || form.situacion;
  const p = {
    tipo: g("f-tipo")||form.tipo,
    barrio: g("f-barrio")||form.barrio,
    direccion: dir,
    precio: Number(precio)||0,
    moneda: "USD",
    expensas: Number(g("f-expensas"))||0,
    sup_total: Number(g("f-suptotal"))||0,
    sup_cubierta: Number(g("f-supcub"))||0,
    sup_terreno: Number(g("f-supter"))||0,
    ambientes: Number(g("f-amb"))||0,
    dormitorios: Number(g("f-dorm"))||0,
    baños: Number(g("f-banos"))||0,
    antiguedad: g("f-antig"),
    condicion: g("f-cond"),
    disposicion: g("f-disp"),
    situacion: sit,
    apto_credito: g("f-apto"),
    fin_permuta: g("f-finperm"),
    alquilado: sit === "Alquilada",
    ini_contrato: g("f-ini")||"",
    fin_contrato: g("f-fin")||"",
    alq_mensual: Number(g("f-alqmens"))||0,
    ajuste: g("f-ajuste")||"",
    observaciones: g("f-obs"),
    inquilino: g("f-inquilino")||"",
    telefono: g("f-telefono")||"",
    mail: g("f-mail")||"",
    valor_inicial: Number(g("f-valinicial"))||0,
    propietario: g("f-prop")||"",
    tel_propietario: g("f-telprop")||"",
    mail_propietario: g("f-mailprop")||""
  };
  if(panelId){
    const original = props.find(x => x.id === panelId);
    const historial = [];
    if(original){
      if(original.precio !== p.precio){
        historial.push({propiedad_id: panelId, tipo_precio: 'venta', valor_anterior: original.precio, valor_nuevo: p.precio});
      }
      if(original.alq_mensual !== p.alq_mensual && p.alq_mensual > 0){
        historial.push({propiedad_id: panelId, tipo_precio: 'alquiler', valor_anterior: original.alq_mensual, valor_nuevo: p.alq_mensual});
      }
    }
    const { error } = await db.from("propiedades").update(p).eq("id", panelId);
    if(error){ showToast("Error: " + error.message); return; }
    if(historial.length > 0){
      await db.from("historial_precios").insert(historial);
    }
    showToast("Propiedad actualizada ✓");
  } else {
    const { error } = await db.from("propiedades").insert(p).select().single();
    if(error){ showToast("Error: " + error.message); return; }
    showToast("Propiedad guardada ✓");
  }
  const { data: fresh } = await db.from("propiedades").select("*").order("id");
  if(fresh) props = fresh;
  closePanel(); renderMain();
}

async function renderHistorialPanel(propId){
  try {
    const { data: hist, error } = await db.from("historial_precios")
      .select("*").eq("propiedad_id", propId).order("fecha", {ascending: false});
    if(error) throw error;
    if(!hist || hist.length === 0){
      return `<div style="padding:20px;color:var(--text-3);font-size:13px;text-align:center">Sin cambios de precio registrados aún.<br><small>Los cambios se registran automáticamente al editar.</small></div>`;
    }
    return hist.map(h => {
      const fecha = new Date(h.fecha).toLocaleDateString("es-AR", {day:"2-digit",month:"2-digit",year:"numeric", hour:"2-digit", minute:"2-digit"});
      const tipo = h.tipo_precio === "venta" ? "💰 Precio venta" : "📋 Alquiler mensual";
      const moneda = h.tipo_precio === "venta" ? "USD " : "$";
      const ant = moneda + Number(h.valor_anterior).toLocaleString("es-AR");
      const nuevo = moneda + Number(h.valor_nuevo).toLocaleString("es-AR");
      const subio = h.valor_nuevo > h.valor_anterior;
      return `<div style="padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:12px;font-weight:500;margin-bottom:3px">${tipo}</div>
          <div style="font-size:11px;color:var(--text-3)">${fecha}</div>
        </div>
        <div style="text-align:right;font-size:12px">
          <div style="color:var(--text-3);text-decoration:line-through">${ant}</div>
          <div style="font-weight:600;color:${subio?"var(--green)":"var(--red)"}">${subio?"↑":"↓"} ${nuevo}</div>
        </div>
      </div>`;
    }).join("");
  } catch(e) {
    return `<div style="padding:20px;color:var(--red);font-size:12px">Error al cargar historial: ${e.message}</div>`;
  }
}

function calcularAjuste(propId, alqActual){
  const tipo = document.getElementById(`calc-tipo-${propId}`)?.value;
  const val = parseFloat(document.getElementById(`calc-val-${propId}`)?.value);
  const inputWrap = document.getElementById(`calc-input-wrap-${propId}`);
  const resultado = document.getElementById(`calc-resultado-${propId}`);
  const nuevo = document.getElementById(`calc-nuevo-${propId}`);
  const diff = document.getElementById(`calc-diff-${propId}`);
  const btn = document.getElementById(`calc-btn-${propId}`);

  if(inputWrap){
    const label = inputWrap.querySelector("label");
    const input = inputWrap.querySelector("input");
    if(tipo === "icl"){
      if(label) label.textContent = "Valor ICL";
      if(input) input.placeholder = "Ej: 1.35";
    } else {
      if(label) label.textContent = "Porcentaje (%)";
      if(input) input.placeholder = "Ej: 30";
    }
  }

  if(!val || val <= 0){ 
    if(resultado) resultado.style.display = "none";
    if(btn) btn.style.display = "none";
    return; 
  }

  let nuevoValor;
  if(tipo === "icl"){
    nuevoValor = Math.round(alqActual * val);
  } else {
    nuevoValor = Math.round(alqActual * (1 + val/100));
  }

  const diferencia = nuevoValor - alqActual;
  const pct = ((diferencia / alqActual) * 100).toFixed(1);

  if(nuevo) nuevo.textContent = "$" + nuevoValor.toLocaleString("es-AR");
  if(diff) diff.textContent = `+ $${diferencia.toLocaleString("es-AR")} (${pct}% de aumento)`;
  if(resultado) resultado.style.display = "block";
  if(btn){ btn.style.display = "block"; btn.dataset.nuevo = nuevoValor; }
}

async function aplicarAjuste(propId){
  const btn = document.getElementById(`calc-btn-${propId}`);
  const nuevoValor = Number(btn?.dataset.nuevo);
  if(!nuevoValor) return;
  if(!confirm(`¿Confirmar nuevo alquiler de $${nuevoValor.toLocaleString("es-AR")}/mes?`)) return;

  const original = props.find(x => x.id === propId);
  const { error } = await db.from("propiedades").update({alq_mensual: nuevoValor}).eq("id", propId);
  if(error){ showToast("Error: " + error.message); return; }

  await db.from("historial_precios").insert({
    propiedad_id: propId,
    tipo_precio: "alquiler",
    valor_anterior: original.alq_mensual,
    valor_nuevo: nuevoValor
  });

  const { data: fresh } = await db.from("propiedades").select("*").order("id");
  if(fresh) props = fresh;
  showToast("Alquiler actualizado ✓");
  openDetail(propId);
}

// GESTIÓN DE ALQUILERES

let gAlq = [], gPagos = [], gMesActual = '';

function getMesActual(){
  const now = new Date();
  return `${String(now.getMonth()+1).padStart(2,'0')}-${now.getFullYear()}`;
}

function fmtMes(periodo){
  if(!periodo) return '';
  const [m,y] = periodo.split('-');
  const meses = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return `${meses[parseInt(m)]} ${y}`;
}

function prevMes(p){ const [m,y]=p.split('-').map(Number); return m===1?`12-${y-1}`:`${String(m-1).padStart(2,'0')}-${y}`; }
function nextMes(p){ const [m,y]=p.split('-').map(Number); return m===12?`01-${y+1}`:`${String(m+1).padStart(2,'0')}-${y}`; }

async function loadGestion(){
  if(!gMesActual) gMesActual = getMesActual();
  document.getElementById("main").innerHTML = '<div class="loading"><div class="spinner"></div><span>Cargando gestión...</span></div>';
  const [r1, r2] = await Promise.all([
    db.from("alquileres").select("*").order("id"),
    db.from("pagos_mensuales").select("*").eq("periodo", gMesActual)
  ]);
  if(r1.data) gAlq = r1.data;
  if(r2.data) gPagos = r2.data;
  renderGestion();
}

function renderGestion(){
  const pagosMap = {};
  gPagos.forEach(p => pagosMap[p.alquiler_id] = p);

  const conImporte = gAlq.filter(a => a.alq_actual && a.alq_actual > 0 && !a.parent_id);
  const sinInquilino = gAlq.filter(a => !a.parent_id && (!a.inquilino || a.inquilino.trim() === ''));
  const pagados = gPagos.filter(p => p.estado === 'pagado').length;
  const pendientes = conImporte.length - gPagos.filter(p => p.estado === 'pagado' || p.estado === 'parcial').length;

  const pagosConAlq = gPagos.map(p => {
    const alq = gAlq.find(a => a.id === p.alquiler_id);
    return { ...p, propietario: alq?.propietario };
  });
  const cobradoClientes = pagosConAlq
    .filter(p => p.propietario && p.propietario.toLowerCase() !== 'fideicomiso' && p.monto_cobrado)
    .reduce((s, p) => s + (p.monto_cobrado || 0), 0);
  const cobradoFideicomiso = pagosConAlq
    .filter(p => p.propietario && p.propietario.toLowerCase() === 'fideicomiso' && p.monto_cobrado)
    .reduce((s, p) => s + (p.monto_cobrado || 0), 0);
  const cobradoTotal = cobradoClientes + cobradoFideicomiso;
  const totalCobrado = gPagos.reduce((s,p) => s + (p.monto_cobrado||0), 0);

  const byProp = {};
  gAlq.forEach(a => {
    const k = a.propietario || 'Sin propietario';
    if(!byProp[k]) byProp[k] = [];
    byProp[k].push(a);
  });

  const [mesNum] = gMesActual.split('-');
  const nombresMes = ['','ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
  const mesNombre = nombresMes[parseInt(mesNum)];
  const conAumento = gAlq.filter(a => a.mes_aumento && a.mes_aumento.toUpperCase().includes(mesNombre));

  const rows = Object.entries(byProp).map(([prop, items]) => {
    const itemRows = items.map(a => {
      const pago = pagosMap[a.id];
      const estado = pago ? pago.estado : 'pendiente';
      const tieneImporte = a.alq_actual && a.alq_actual > 0;
      const estadoBadge = !tieneImporte
        ? `<span style="font-size:11px;color:var(--text-3)">Sin importe</span>`
        : estado === 'pagado' ? `<span class="badge" style="background:#EAF3DE;color:#3B6D11">✓ Pagado</span>`
        : estado === 'parcial' ? `<span class="badge" style="background:#FEF3E2;color:#92400E">Parcial</span>`
        : estado === 'no_pago' ? `<span class="badge" style="background:#FCEBEB;color:#A32D2D">No pagó</span>`
        : estado === 'pago-pendiente' ? (pago?.comprobante_url ? `<a href="${pago.comprobante_url}" target="_blank" onclick="event.stopPropagation()" class="badge" style="background:#E8F4FD;color:#1565C0;border:1px solid #90CAF9;text-decoration:none;cursor:pointer">📎 Comp. recibido</a>` : `<span class="badge" style="background:#E8F4FD;color:#1565C0;border:1px solid #90CAF9">📎 Comp. recibido</span>`)
        : `<span class="badge" style="background:#F1EFE8;color:#5F5E5A">Pendiente</span>`;
      const montoFmt = pago?.monto_cobrado ? `$${Number(pago.monto_cobrado).toLocaleString('es-AR')}` : (a.alq_actual ? `$${Number(a.alq_actual).toLocaleString('es-AR')}` : '—');
      const hayAumento = a.mes_aumento && a.mes_aumento.toUpperCase().includes(mesNombre);

      // Alertas de vencimiento de pago
      const hoy = new Date();
      const diaHoy = hoy.getDate();
      const pagoVencido = tieneImporte && diaHoy > 10 && !['pagado','parcial'].includes(estado);

      // Alertas de vencimiento de contrato
      let alertaContrato = null;
      if(a.fin_contrato){
        const fin = new Date(a.fin_contrato);
        const diffDias = Math.round((fin - hoy) / (1000*60*60*24));
        if(diffDias >= 0 && diffDias <= 30) alertaContrato = 'urgente';
        else if(diffDias > 30 && diffDias <= 60) alertaContrato = 'proximo';
      }

      const rowBg = pagoVencido ? 'background:#FFF0F0;' 
                  : alertaContrato === 'urgente' ? 'background:#FFF0F0;'
                  : alertaContrato === 'proximo' ? 'background:#FFFBEB;'
                  : '';

      const alertaIcon = pagoVencido ? ' <span title="Pago vencido (después del día 10)" style="color:#C0392B">⚠</span>' 
                       : alertaContrato === 'urgente' ? ' <span title="Contrato vence en menos de 30 días" style="color:#C0392B">🔴</span>'
                       : alertaContrato === 'proximo' ? ' <span title="Contrato vence en menos de 60 días" style="color:#E67E22">🟡</span>'
                       : '';

      return `<tr onclick="openGestionDetail(${a.id})" style="cursor:pointer;${rowBg}">
        <td title="${a.unidad||''}">${a.unidad||'—'} ${hayAumento ? '<span title="Mes de aumento" style="color:var(--accent)">⬆</span>' : ''}${alertaIcon}</td>
        <td>${a.inquilino||'—'}</td>
        <td style="font-size:11px;color:var(--text-2)">${a.tipo_contrato||'—'}</td>
        <td>${montoFmt}</td>
        <td>${estadoBadge}</td>
        <td onclick="event.stopPropagation()" style="white-space:nowrap;display:flex;flex-direction:column;gap:4px;border:none">
          ${tieneImporte ? `<button class="btn-sm" onclick="abrirDetalleWhatsApp(${a.id})">📤 Detalle</button>` : ''}
          <button class="btn-sm" onclick="abrirPago(${a.id})">💰 Cobro</button>
          <button class="btn-sm" onclick="copiarLinkPago(${a.id})" title="Copiar link de pago para inquilino">🔗 Link</button>
        </td>
      </tr>`;
    }).join('');
    return `<div class="group-section" style="margin-bottom:20px">
      <div class="group-header">
        <span>👤</span>
        <span class="group-title">${prop}</span>
        <span class="group-count">${items.filter(a => !a.parent_id).length}</span>
      </div>
      <div class="table-wrap" style="border-radius:0 0 var(--radius) var(--radius);border-top:none">
        <table>
          <thead><tr>
            <th>Unidad</th><th style="width:160px">Inquilino</th>
            <th style="width:130px">Contrato</th><th style="width:120px">Alquiler</th>
            <th style="width:110px">Estado</th><th style="width:80px">Acción</th>
          </tr></thead>
          <tbody>${itemRows}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');

  document.getElementById("main").innerHTML = `
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <h2>Gestión de Alquileres</h2>
        <p>${new Date().toLocaleDateString("es-AR",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}</p>
      </div>
      <div style="display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px">
        <button onclick="gMesActual=prevMes(gMesActual);loadGestion()" style="background:none;border:none;cursor:pointer;font-size:16px;color:var(--text-2)">‹</button>
        <span style="font-weight:500;font-size:14px;min-width:130px;text-align:center">${fmtMes(gMesActual)}</span>
        <button onclick="gMesActual=nextMes(gMesActual);loadGestion()" style="background:none;border:none;cursor:pointer;font-size:16px;color:var(--text-2)">›</button>
      </div>
    </div>
    <div class="stats" style="grid-template-columns:repeat(7,1fr)">
      <div class="stat-card"><div class="stat-label">Total unidades</div><div class="stat-value">${gAlq.filter(a => !a.parent_id).length}</div></div>
      <div class="stat-card"><div class="stat-label">Pend. alquilar</div><div class="stat-value orange">${sinInquilino.length}</div></div>
      <div class="stat-card"><div class="stat-label">Pagados</div><div class="stat-value green">${pagados}</div></div>
      <div class="stat-card"><div class="stat-label">Pendientes</div><div class="stat-value" style="color:var(--red)">${pendientes}</div></div>
      <div class="stat-card"><div class="stat-label">Cobrado clientes</div><div class="stat-value accent" style="font-size:13px">$${cobradoClientes.toLocaleString('es-AR')}</div></div>
      <div class="stat-card"><div class="stat-label">Cobrado fideicomiso</div><div class="stat-value accent" style="font-size:13px">$${cobradoFideicomiso.toLocaleString('es-AR')}</div></div>
      <div class="stat-card"><div class="stat-label">Cobrado este mes</div><div class="stat-value accent" style="font-size:13px">$${cobradoTotal.toLocaleString('es-AR')}</div></div>
    </div>
    ${conAumento.length > 0 ? `<div style="background:#FFFDF5;border:1px solid var(--accent);border-radius:var(--radius);padding:12px 16px;margin-bottom:20px;font-size:13px">
      <span style="color:var(--accent);font-weight:600">⬆ ${conAumento.length} unidad${conAumento.length!==1?'es':''} con aumento en ${fmtMes(gMesActual)}:</span>
      <span style="color:var(--text-2);margin-left:8px">${conAumento.map(a=>a.unidad).join(' · ')}</span>
    </div>` : ''}
    <div class="toolbar">
      <div class="search-wrap"><span class="search-icon">⌕</span><input placeholder="Buscar unidad, inquilino, propietario..." oninput="filtrarGestion(this.value)"></div>
      <button class="btn-primary" onclick="abrirCobroRapido()" style="white-space:nowrap">⚡ Cobro rápido</button>
    </div>
    <div id="gestion-list">${rows}</div>`;
}

  modal.innerHTML = `

function filtrarCobroRapido(q){
  const s = q.toLowerCase().trim();
  const container = document.getElementById('cr-results');
  if(!container) return;
  if(s.length < 2){ container.innerHTML = '<div style="text-align:center;color:var(--text-3);padding:20px;font-size:13px">Escribí al menos 2 letras</div>'; return; }

  const matches = gAlq.filter(a =>
    a.alq_actual > 0 && (
      (a.inquilino||'').toLowerCase().includes(s) ||
      (a.unidad||'').toLowerCase().includes(s) ||
      (a.propietario||'').toLowerCase().includes(s)
    )
  ).slice(0, 10);

  if(matches.length === 0){ container.innerHTML = '<div style="text-align:center;color:var(--text-3);padding:20px;font-size:13px">No se encontraron unidades</div>'; return; }

  const pagosMap = {};
  gPagos.forEach(p => pagosMap[p.alquiler_id] = p);

  container.innerHTML = matches.map(a => {
    const pago = pagosMap[a.id];
    const estadoColor = pago?.estado === 'pagado' ? '#3B6D11' : pago?.estado === 'parcial' ? '#92400E' : '#A32D2D';
    const estadoTxt = pago?.estado === 'pagado' ? '✓ Pagado' : pago?.estado === 'parcial' ? 'Parcial' : 'Pendiente';
    return `<div onclick="seleccionarCobroRapido(${a.id})"
      style="padding:14px;margin-bottom:8px;background:var(--bg);border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--border)">
      <div style="font-weight:600;font-size:15px;margin-bottom:3px">${a.inquilino || '—'}</div>
      <div style="font-size:12px;color:var(--text-2);margin-bottom:6px">${a.unidad}</div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:14px;font-weight:500">$${Number(a.alq_actual).toLocaleString('es-AR')}</span>
        <span style="font-size:12px;color:${estadoColor};font-weight:600">${estadoTxt}</span>
      </div>
    </div>`;
  }).join('');
}

function seleccionarCobroRapido(id){
  document.getElementById('cobro-rapido-modal')?.remove();
  abrirPago(id);
}

          style="width:100%;padding:12px;background:var(--text);color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">
          Guardar
        </button>
      </div>
    </div>`;

  document.getElementById('nuevo-alq-val').addEventListener('input', function(){
    const val = parseFloat(this.value)||0;
    const pct = a.comision_pct||0;
    const preview = document.getElementById('nueva-comision-preview');
    if(val > 0 && pct > 0){
      const nuevaComision = Math.round(val * pct);
      preview.textContent = `Comisión calculada: $${nuevaComision.toLocaleString('es-AR')} (${(pct*100).toFixed(2)}%)`;
    } else {
      preview.textContent = '';
    }
  });
}

async function guardarNuevoAlquiler(alqId){
  const a = gAlq.find(x => x.id === alqId);
  if(!a) return;
  const nuevoMonto = parseFloat(document.getElementById('nuevo-alq-val')?.value);
  if(!nuevoMonto || nuevoMonto <= 0){
    alert('Ingresá un monto válido');
    return;
  }
  const alqAnterior = a.alq_actual || 0;
  const nuevaComision = a.comision_pct ? Math.round(nuevoMonto * a.comision_pct) : a.comision_adm;
  const updateData = {
    alq_anterior: alqAnterior,
    alq_actual: nuevoMonto,
    ...(a.comision_pct ? { comision_adm: nuevaComision } : {})
  };
  const { error } = await db.from('alquileres').update(updateData).eq('id', alqId);
  if(error){
    alert('Error al guardar: ' + error.message);
    return;
  }
  // Update local data
  const idx = gAlq.findIndex(x => x.id === alqId);
  if(idx >= 0){
    gAlq[idx].alq_anterior = alqAnterior;
    gAlq[idx].alq_actual = nuevoMonto;
    if(a.comision_pct) gAlq[idx].comision_adm = nuevaComision;
  }
  document.getElementById('actualizar-alq-modal')?.remove();
  renderGestion();
  alert(`✅ Alquiler actualizado\nAnterior: $${alqAnterior.toLocaleString('es-AR')}\nNuevo: $${nuevoMonto.toLocaleString('es-AR')}`);
}

function onTogglePartido(){
  const checked = document.getElementById('chk-partido')?.checked;
  document.getElementById('bloque-partido').style.display = checked ? 'block' : 'none';
  const label = document.getElementById('alq-label');
  if(label) label.textContent = checked ? 'Nuevo alquiler (monto actualizado)' : label.textContent.replace('Nuevo alquiler (monto actualizado)', label.dataset.orig || label.textContent);
  if(label && !label.dataset.orig) label.dataset.orig = label.textContent;
  if(checked && label) label.textContent = 'Nuevo alquiler (monto actualizado)';
  calcDetalle();
}

function calcDetalle(){
  const a = _detalleAlq;
  if(!a) return;
  const alqEditable = parseFloat(document.getElementById('alq-editable')?.value) || a.alq_actual || 0;
  const esPartido = document.getElementById('chk-partido')?.checked;
  let alqTotal = alqEditable;
  if(esPartido){
    const diasAnt = parseInt(document.getElementById('dp-dias-ant')?.value)||0;
    const montoAnt = parseFloat(document.getElementById('dp-monto-ant')?.value)||0;
    const diasNue = parseInt(document.getElementById('dp-dias-nue')?.value)||0;
    const totalDias = diasAnt + diasNue;
    if(totalDias > 0 && montoAnt > 0){
      alqTotal = ((montoAnt/totalDias)*diasAnt) + ((alqEditable/totalDias)*diasNue);
      const res = document.getElementById('dp-resumen');
      if(res) res.textContent = `${diasAnt} días × $${Math.round(montoAnt/totalDias).toLocaleString('es-AR')} + ${diasNue} días × $${Math.round(alqEditable/totalDias).toLocaleString('es-AR')} = $${Math.round(alqTotal).toLocaleString('es-AR')}`;
    }
  }
  const honorarios = parseFloat(document.getElementById('honorarios-val')?.value) || 0;
  let totalDed = 0, totalMao = 0;
  const chkHonor = document.getElementById('chk-honor');
  if(chkHonor?.checked){
    totalDed += honorarios;
    if(document.getElementById('honor-mao')?.checked) totalMao += honorarios;
  }
  document.querySelectorAll('#ded-extra-rows .ded-row').forEach(row => {
    const chk = row.querySelector('input[type=checkbox]:not(.chk-mao)');
    if(!chk?.checked) return;
    const inp = row.querySelector('input[type=number]');
    const val = parseFloat(inp?.value)||0;
    totalDed += val;
    if(row.querySelector('.chk-mao')?.checked) totalMao += val;
  });
  const duenaEl = document.getElementById('total-duena-val');
  const maoEl = document.getElementById('total-mao-val');
  if(duenaEl) duenaEl.textContent = '$'+Math.round(alqTotal-totalDed).toLocaleString('es-AR');
  if(maoEl) maoEl.textContent = '$'+Math.round(totalMao).toLocaleString('es-AR');
}

function agregarDedExtra(){
  const wrap = document.getElementById('ded-extra-rows');
  if(!wrap) return;
  const div = document.createElement('div');
  div.className = 'ded-row';
  div.style.cssText = 'display:grid;grid-template-columns:20px 1fr 110px 60px;gap:8px;align-items:center;margin-bottom:8px';

      const span = row.querySelector('span');
      if(span && span.textContent===label){
        val = parseFloat(row.querySelector('input[type=number]')?.value)||0;
      }
    });
    return val;
  };

  let comprobanteUrl = null;
  const fileInput = document.getElementById('comprobante-file');
  const file = fileInput?.files?.[0];
  if(file){
    const ext = file.name.split('.').pop();
    const path = `${a.id}/${gMesActual}.${ext}`;
    const { data: upData, error: upErr } = await db.storage.from('comprobantes').upload(path, file, { upsert: true });
    if(!upErr){
      const { data: urlData } = db.storage.from('comprobantes').getPublicUrl(path);
      comprobanteUrl = urlData?.publicUrl || null;
    }
  }

  const { data: existing } = await db.from('pagos_mensuales')
    .select('id').eq('alquiler_id', a.id).eq('periodo', gMesActual).maybeSingle();

  const difMonto = parseFloat(document.getElementById('diferencia-monto')?.value)||0;
  const difDesc = document.getElementById('diferencia-desc')?.value||'';
  const registro = {
    alquiler_id: a.id,
    periodo: gMesActual,
    estado: 'pago-pendiente',
    monto_cobrado: Math.round(alqTotal),
    honorarios: honorarios,
    expensas: getDed('Expensas ext.'),
    api: getDed('API'),
    tgi: getDed('TGI'),
    otros: otrosArr.length > 0 ? otrosArr : null,
    total_duena: totalDuena,
    total_mao: Math.round(totalMao),
    fecha_envio: new Date().toISOString(),
    ...(difMonto > 0 ? { diferencia_monto: difMonto, diferencia_descripcion: difDesc } : {}),
    ...(comprobanteUrl ? { comprobante_url: comprobanteUrl } : {})
  };

  if(existing){
    await db.from('pagos_mensuales').update(registro).eq('id', existing.id);
  } else {
    await db.from('pagos_mensuales').insert(registro);
  }

  const waUrl = `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(waUrl,'_blank');
  document.getElementById('detalle-modal')?.remove();
  loadGestion();
}

async function loadResumen(){
  const main = document.getElementById('main');
  main.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-3)">Cargando resumen...</div>`;

  const [mesNum, anio] = gMesActual.split('-');
  const mesNombres = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const mesNombre = mesNombres[parseInt(mesNum)] + ' ' + anio;

  // Fetch pagos del mes
  const { data: pagos } = await db.from('pagos_mensuales')
    .select('*').eq('periodo', gMesActual);
  const { data: propietarios } = await db.from('propietarios').select('*');
  const alquileres = gAlq || [];

  const pagosMap = {};
  (pagos||[]).forEach(p => pagosMap[p.alquiler_id] = p);

  // Totales globales
  const pagados = (pagos||[]).filter(p => p.estado === 'pagado' || p.estado === 'parcial');
  const totalCobrado = pagados.reduce((s,p) => s + (p.monto_cobrado||0), 0);
  const totalHonorarios = pagados.reduce((s,p) => s + (p.honorarios||0), 0);
  const totalMao = pagados.reduce((s,p) => s + (p.total_mao||0), 0);
  const countPagados = pagados.length;
  const countPendientes = alquileres.filter(a => a.alq_actual > 0 && !a.parent_id && (!pagosMap[a.id] || !['pagado','parcial'].includes(pagosMap[a.id].estado))).length;

  // Desglose por propietario
  const byProp = {};
  alquileres.filter(a => a.alq_actual > 0 && !a.parent_id).forEach(a => {
    const propNombre = a.propietario || 'Sin propietario';
    if(!byProp[propNombre]) byProp[propNombre] = { unidades: [], pagadas: 0, totalACobrar: 0, totalCobrado: 0, honorarios: 0, propietario_id: a.propietario_id };
    byProp[propNombre].unidades.push(a);
    byProp[propNombre].totalACobrar += a.alq_actual || 0;
    const pago = pagosMap[a.id];
    if(pago && ['pagado','parcial'].includes(pago.estado)){
      byProp[propNombre].pagadas++;
      byProp[propNombre].totalCobrado += pago.monto_cobrado || 0;
      byProp[propNombre].honorarios += pago.honorarios || 0;
    }
  });

  const rows = Object.entries(byProp).sort((a,b) => a[0].localeCompare(b[0])).map(([nombre, d]) => {
    const pct = d.unidades.length > 0 ? Math.round((d.pagadas/d.unidades.length)*100) : 0;
    const estadoColor = pct === 100 ? 'var(--green)' : pct === 0 ? 'var(--red)' : 'var(--accent)';
    const estadoBg = pct === 100 ? '#EAF3DE' : pct === 0 ? '#FCEBEB' : '#FEF3E2';
    const estadoTxt = pct === 100 ? '#3B6D11' : pct === 0 ? '#A32D2D' : '#92400E';
    return `<tr style="border-top:1px solid var(--border)">
      <td style="padding:11px 16px;font-size:13px">${nombre}</td>
      <td style="padding:11px 12px;text-align:center;font-size:13px">${d.unidades.length}</td>
      <td style="padding:11px 12px;text-align:right;font-size:13px">$${Math.round(d.totalACobrar).toLocaleString('es-AR')}</td>
      <td style="padding:11px 12px;text-align:right;font-size:13px;color:${d.totalCobrado>0?'var(--green)':'var(--text-3)'}">$${Math.round(d.totalCobrado).toLocaleString('es-AR')}</td>
      <td style="padding:11px 12px;text-align:right;font-size:13px;color:var(--blue)">$${Math.round(d.honorarios).toLocaleString('es-AR')}</td>
      <td style="padding:11px 16px;text-align:center">
        <span style="background:${estadoBg};color:${estadoTxt};font-size:11px;padding:3px 8px;border-radius:4px">${d.pagadas}/${d.unidades.length}</span>
      </td>
      <td style="padding:8px 12px;text-align:center">
        <div style="display:flex;flex-direction:column;gap:4px;align-items:center">
          <button onclick="generarInformePropietario('${nombre.replace(/'/g,String.fromCharCode(39))}')" style="font-size:11px;padding:3px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-family:inherit;white-space:nowrap">📄 Doc</button>
          <button onclick="enviarInformePorEmail('${nombre.replace(/'/g,String.fromCharCode(39))}')" style="font-size:11px;padding:3px 10px;background:#E8F0FE;border:1px solid #4285F4;border-radius:6px;cursor:pointer;font-family:inherit;color:#1a73e8;white-space:nowrap">✉ Email</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  main.innerHTML = `
    <div style="padding:32px 32px 24px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px">
        <div>
          <h2 style="font-family:'DM Serif Display',serif;font-size:26px;font-weight:400;margin:0 0 4px">Resumen mensual</h2>
          <div style="font-size:13px;color:var(--text-3)">${mesNombre}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button onclick="gMesActual=prevMes(gMesActual);loadResumen()" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--text-2)">‹</button>
          <span style="font-size:13px;font-weight:500;min-width:100px;text-align:center">${mesNombre}</span>
          <button onclick="gMesActual=nextMes(gMesActual);loadResumen()" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--text-2)">›</button>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:28px">
        <div style="background:var(--bg);border-radius:var(--radius);padding:14px 16px">
          <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Total cobrado</div>
          <div style="font-size:22px;font-weight:500;color:var(--green)">$${Math.round(totalCobrado).toLocaleString('es-AR')}</div>
        </div>
        <div style="background:var(--bg);border-radius:var(--radius);padding:14px 16px">
          <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Total a Mao</div>
          <div style="font-size:22px;font-weight:500;color:var(--blue)">$${Math.round(totalMao||totalHonorarios).toLocaleString('es-AR')}</div>
        </div>
        <div style="background:var(--bg);border-radius:var(--radius);padding:14px 16px">
          <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Pagados</div>
          <div style="font-size:22px;font-weight:500;color:var(--green)">${countPagados}</div>
        </div>
        <div style="background:var(--bg);border-radius:var(--radius);padding:14px 16px">
          <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Pendientes</div>
          <div style="font-size:22px;font-weight:500;color:var(--red)">${countPendientes}</div>
        </div>
      </div>

      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
        <div style="padding:14px 18px;border-bottom:1px solid var(--border);font-weight:500;font-size:14px">Desglose por propietario</div>
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse">
            <thead>
              <tr style="background:var(--bg)">
                <th style="padding:10px 16px;text-align:left;font-size:12px;font-weight:500;color:var(--text-3)">Propietario</th>
                <th style="padding:10px 12px;text-align:center;font-size:12px;font-weight:500;color:var(--text-3)">Unidades</th>
                <th style="padding:10px 12px;text-align:right;font-size:12px;font-weight:500;color:var(--text-3)">A cobrar</th>
                <th style="padding:10px 12px;text-align:right;font-size:12px;font-weight:500;color:var(--text-3)">Cobrado</th>
                <th style="padding:10px 12px;text-align:right;font-size:12px;font-weight:500;color:var(--text-3)">Honorarios</th>
                <th style="padding:10px 16px;text-align:center;font-size:12px;font-weight:500;color:var(--text-3)">Estado</th>
                <th style="padding:10px 16px;text-align:center;font-size:12px;font-weight:500;color:var(--text-3)">Informe</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
            <tfoot>
              <tr style="border-top:2px solid var(--border);background:var(--bg)">
                <td style="padding:11px 16px;font-size:13px;font-weight:500">Total</td>
                <td></td>
                <td style="padding:11px 12px;text-align:right;font-size:13px;font-weight:500">$${Math.round(Object.values(byProp).reduce((s,d)=>s+d.totalACobrar,0)).toLocaleString('es-AR')}</td>
                <td style="padding:11px 12px;text-align:right;font-size:13px;font-weight:500;color:var(--green)">$${Math.round(totalCobrado).toLocaleString('es-AR')}</td>
                <td style="padding:11px 12px;text-align:right;font-size:13px;font-weight:500;color:var(--blue)">$${Math.round(totalHonorarios).toLocaleString('es-AR')}</td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>`;
}

async function generarInformePropietario(propNombre){
  try {
  const [mesNum, anio] = gMesActual.split('-');
  const mesesNombres = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const mesNombre = mesesNombres[parseInt(mesNum)];
  const hoy = new Date();
  const fechaDoc = `Rosario, ${hoy.getDate()} de ${mesNombre} de ${anio}.`;

  const alqsProp = gAlq.filter(a => a.propietario === propNombre && a.alq_actual > 0);
  const ids = alqsProp.map(a => a.id);
  let pagosData = [];
  if(ids.length > 0){
    const { data } = await db.from('pagos_mensuales').select('*').eq('periodo', gMesActual).in('alquiler_id', ids);
    pagosData = data || [];
  }
  const pagosMap = {};
  pagosData.forEach(p => pagosMap[p.alquiler_id] = p);

  const fmtNum = n => {
    if(!n && n !== 0) return '0';
    const num = Number(n);
    return num % 1 !== 0 ? num.toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}) : num.toLocaleString('es-AR');
  };

  let body = '';
  let grandTotal = 0;
  const transferDates = [];

  alqsProp.forEach((a, idx) => {
    const pago = pagosMap[a.id];
    if(idx > 0) body += '<br><br>';

    body += `<p><strong><u>${a.unidad || ''}</u></strong></p>`;
    body += `<p>Inquilino: <strong>${a.inquilino || ''}</strong></p>`;
    if(a.inicio_contrato) body += `<p><u>Fecha de Inicio de contrato:</u> ${a.inicio_contrato}</p>`;
    if(a.fin_contrato) body += `<p><u>Fecha de finalización de contrato:</u> ${a.fin_contrato}</p>`;
    body += '<br>';

    if(!pago){
      body += `<p><strong>Alquiler ${mesNombre} $${fmtNum(a.alq_actual)}.-</strong></p>`;
      body += `<p>Sin pago registrado este mes.</p>`;
      return;
    }

    // Diferencia mes anterior
    if(pago.diferencia_monto > 0){
      const difDesc = pago.diferencia_descripcion || 'Diferencia mes anterior';
      body += `<p><strong>${difDesc} $${fmtNum(pago.diferencia_monto)}.-</strong></p>`;
    }

    // Alquiler - split month check
    const diasMes = new Date(parseInt(anio), parseInt(mesNum), 0).getDate();
    if(a.alq_anterior && a.alq_anterior > 0 && a.alq_anterior !== a.alq_actual){
      const diaInicio = a.inicio_contrato ? parseInt(a.inicio_contrato.split('/')[0]) : 1;
      const diasAnt = diaInicio - 1;
      const diasNue = diasMes - diasAnt;
      if(diasAnt > 0){
        body += `<p><strong>Alquiler ${mesNombre} ${diasAnt} días ($${fmtNum(a.alq_anterior)}.-) = $${fmtNum((a.alq_anterior/diasMes)*diasAnt)}.-</strong></p>`;
        body += `<p><strong>Alquiler ${mesNombre} ${diasNue} días ($${fmtNum(a.alq_actual)}.-) = $${fmtNum((a.alq_actual/diasMes)*diasNue)}.-</strong></p>`;
      } else {
        body += `<p><strong>Alquiler ${mesNombre} $${fmtNum(a.alq_actual)}.-</strong></p>`;
      }
    } else {
      body += `<p><strong>Alquiler ${mesNombre} $${fmtNum(a.alq_actual)}.-</strong></p>`;
    }

    // TGI como ingreso
    if(a.tgi_es_ingreso && pago.tgi > 0){
      body += `<p><strong>TGI ${mesNombre} $${fmtNum(pago.tgi)}.-</strong></p>`;
    }

    // Deducciones
    if(pago.honorarios > 0){
      const pct = a.comision_pct ? ` ${(a.comision_pct*100).toFixed(0)}%` : '';
      body += `<p>Se descuentan honorarios inmobiliarios${pct} ($${fmtNum(pago.honorarios)}.-)`;
    }
    if(pago.expensas > 0) body += `<p>Se descuentan expensas extraordinarias ($${fmtNum(pago.expensas)}.-)`;
    if(pago.api > 0) body += `<p>Se descuenta API ($${fmtNum(pago.api)}.-)`;
    if(pago.tgi > 0 && !a.tgi_es_ingreso) body += `<p>Se descuenta TGI ($${fmtNum(pago.tgi)}.-)`;
    if(pago.otros && Array.isArray(pago.otros)){
      pago.otros.forEach(o => {
        if(o.val > 0) body += `<p>Se descuenta ${o.label} ($${fmtNum(o.val)}.-)`;
      });
    }

    body += '<br>';
    const fechaPago = pago.fecha_pago ? new Date(pago.fecha_pago).toLocaleDateString('es-AR') : '—';
    const totalUnidad = pago.total_duena || 0;

    if(pago.fecha_pago) transferDates.push(fechaPago);
    body += `<p><strong>Total transferido el ${fechaPago} $${fmtNum(totalUnidad)}.-</strong></p>`;

  // Grand total
  if(alqsProp.length > 1 && grandTotal > 0){
    body += '<br>';
    body += `<p><strong><u>TOTAL: $${fmtNum(grandTotal)}.-</u></strong></p>`;

</tr></table>
${body}
<div class="footer">Jimena Rubio Mat. N° 1462 - jrubio@maopropiedades.com</div>
</body></html>`;

  const url = URL.createObjectURL(blob);

  a2.download = `Informe_${propNombre.replace(/\s+/g,'_')}_${mesNombre}_${anio}.doc`;

async function guardarPago(alqId, pagoId=null){
  const estado = document.getElementById('pm-estado')?.value;
  const monto = parseFloat(document.getElementById('pm-monto')?.value) || null;
  const fecha = document.getElementById('pm-fecha')?.value || null;
  const obs = document.getElementById('pm-obs')?.value || null;
  
  const btn = document.getElementById('btn-guardar-pago');
  if(btn){ btn.disabled=true; btn.textContent='Guardando...'; }

  // Upload comprobante if provided
  let comprobanteUrl = null;
  const fileInput = document.getElementById('pm-comprobante');
  const file = fileInput?.files?.[0];
  if(file){
    const ext = file.name.split('.').pop();
    const path = `${alqId}/${gMesActual}_pago.${ext}`;
    const { error: upErr } = await db.storage.from('comprobantes').upload(path, file, { upsert: true });
    if(!upErr){
      const { data: urlData } = db.storage.from('comprobantes').getPublicUrl(path);
      comprobanteUrl = urlData?.publicUrl || null;
    }
  }

  document.getElementById('pago-modal')?.remove();

  const updateData = {
    estado, monto_cobrado: monto, fecha_pago: fecha, observaciones: obs,
    ...(comprobanteUrl ? { comprobante_url: comprobanteUrl } : {})
  };

  if(pagoId){
    await db.from('pagos_mensuales').update(updateData).eq('id', pagoId);
  } else {
    await db.from('pagos_mensuales').insert({ alquiler_id: alqId, periodo: gMesActual, ...updateData });
  }
  showToast('Cobro registrado ✓');
  const r = await db.from('pagos_mensuales').select('*').eq('periodo', gMesActual);
  if(r.data) gPagos = r.data;
  renderGestion();
}

        const diaHoy = new Date().getDate();
        const pagoVencidoDetalle = a.alq_actual > 0 && diaHoy > 10 && !['pagado','parcial'].includes(estadoDetalle);
        const alertaPagoHtml = pagoVencidoDetalle ? `<div style="background:#FCEBEB;border:1px solid #E57373;border-radius:8px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px">
          <span style="font-size:20px">⚠️</span>
          <div>
            <div style="font-size:13px;font-weight:600;color:#A32D2D">Pago vencido</div>
            <div style="font-size:12px;color:#A32D2D;margin-top:2px">Ya pasó el día 10 y no hay pago registrado para este mes.</div>
          </div>
        </div>` : '';

        return alertaContratoHtml + alertaPagoHtml + (tieneAumentoEsteMes ? `
        <div style="background:#FFF3CD;border:1px solid #FFCC00;border-radius:8px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px">
          <span style="font-size:20px">📈</span>
          <div>
            <div style="font-size:13px;font-weight:600;color:#7A5800">Mes de aumento</div>
            <div style="font-size:12px;color:#7A5800;margin-top:2px">Este mes corresponde actualizar el alquiler por ICL. Usá el botón <strong>✏️ Actualizar alquiler</strong> para ingresar el nuevo monto.</div>
          </div>
        </div>` : '');
      })()}
      <div class="section-label">📋 Contrato</div>
      <div class="detail-grid" style="margin-bottom:16px">
        ${field('Inicio', a.inicio_contrato ? new Date(a.inicio_contrato).toLocaleDateString('es-AR') : null)}
        ${field('Fin', a.fin_contrato ? new Date(a.fin_contrato).toLocaleDateString('es-AR') : null)}
        ${field('Alq. inicial', a.alq_inicial ? '$'+Number(a.alq_inicial).toLocaleString('es-AR') : null)}
        ${field('Alq. actual', a.alq_actual ? '$'+Number(a.alq_actual).toLocaleString('es-AR') : null)}
        ${field('Comisión', a.comision_pct ? (a.comision_pct*100)+'%' : null)}
        ${field('Comisión adm.', a.comision_adm ? '$'+Number(a.comision_adm).toLocaleString('es-AR') : null)}
        ${field('Mes aumento', a.mes_aumento)}
        ${field('Seguro', a.seguro)}
      </div>

      ${(a.tgi_cuenta||a.api||a.aguas||a.gas_cliente||a.epe_cliente) ? `
      <div class="section-label">⚡ Servicios</div>
      <div class="detail-grid" style="margin-bottom:16px">
        ${field('TGI cuenta', a.tgi_cuenta)}
        ${field('TGI gestión', a.tgi_gestion)}
        ${field('API', a.api)}
        ${field('Aguas', a.aguas)}
        ${field('Gas cliente', a.gas_cliente)}
        ${field('Gas persona', a.gas_persona)}
        ${field('EPE cliente', a.epe_cliente)}
        ${field('EPE plan', a.epe_plan)}
      </div>` : ''}

      <div class="section-label">💰 Últimos 12 meses</div>
      ${historial && historial.length > 0 ? historial.map(p => {
        const col = p.estado==='pagado'?'var(--green)':p.estado==='parcial'?'var(--accent)':p.estado==='no_pago'?'var(--red)':'var(--text-3)';
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--bg);border-radius:6px;margin-bottom:6px;font-size:13px">
          <span style="font-weight:500">${fmtMes(p.periodo)}</span>
          <span style="color:${col};font-weight:600">${p.estado==='pagado'?'✓ Pagado':p.estado==='parcial'?'Parcial':p.estado==='no_pago'?'No pagó':'Pendiente'}</span>
          <span>${p.monto_cobrado ? '$'+Number(p.monto_cobrado).toLocaleString('es-AR') : '—'}</span>
          ${p.observaciones ? `<span style="font-size:11px;color:var(--text-3)">${p.observaciones}</span>` : ''}
        </div>`;
      }).join('') : '<div style="font-size:13px;color:var(--text-3);text-align:center;padding:16px">Sin registros de pago aún</div>'}
    </div>
    <div class="detail-actions">
      ${a.alq_actual > 0 ? `<button class="btn-primary" onclick="closePanel();abrirPago(${a.id})">💰 Registrar cobro</button>` : ''}
      <button class="btn-secondary" onclick="actualizarAlquiler(${a.id})">✏️ Actualizar alquiler</button>
      <button class="btn-secondary" onclick="closePanel()">Cerrar</button>
    </div>`;
  document.getElementById('panel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

let currentUser = null;

function logout(){
  sessionStorage.removeItem("jota_user");
  location.reload();
}

function applyRole(user){
  currentUser = user;
  const ui = document.getElementById("user-info");
  if(ui){ ui.style.display="block"; }
  document.getElementById("user-name").textContent = user.nombre;
  document.getElementById("user-rol").textContent = user.rol === "admin" ? "Administrador" : user.rol === "ventas" ? "Socio Ventas" : "Socio Alquileres";

  if(user.rol === "alquileres"){
    const navProp = document.getElementById("nav-propiedades");
    if(navProp) navProp.style.display = "none";
    const navVend = document.getElementById("nav-vendidas");
    if(navVend) navVend.style.display = "none";
    const navAlq = document.getElementById("nav-alquiladas");
    if(navAlq) navAlq.style.display = "none";
    const navAl = document.getElementById("nav-alertas");
    if(navAl) navAl.style.display = "none";
  }
  if(user.rol === "ventas"){
    const navG = document.getElementById("nav-gestion");
    if(navG) navG.style.display = "none";
  }
}

async function checkLogin(){
  const email = document.getElementById("email-input").value.trim().toLowerCase();
  const pwd = document.getElementById("pwd-input").value;
  const errEl = document.getElementById("login-error");
  errEl.textContent = "";

  if(!email || !pwd){ errEl.textContent = "Completá email y contraseña"; return; }

  const btn = document.querySelector(".login-btn");
  btn.textContent = "Ingresando..."; btn.disabled = true;

  try {
    const dbTemp = supabase.createClient(SUPA_URL, SUPA_KEY);
    const { data, error } = await dbTemp.from("usuarios")
      .select("*")
      .eq("email", email)
      .eq("password", pwd)
      .single();

    if(error || !data){
      errEl.textContent = "Email o contraseña incorrectos";
      btn.textContent = "Ingresar"; btn.disabled = false;
      document.getElementById("pwd-input").value = "";
      return;
    }

    sessionStorage.setItem("jota_user", JSON.stringify(data));
    document.getElementById("login-wrap").style.display = "none";
    applyRole(data);
    init();
  } catch(e) {
    errEl.textContent = "Error de conexión";
    btn.textContent = "Ingresar"; btn.disabled = false;
  }
}

// Verificar si ya está autenticado
const _savedUser = sessionStorage.getItem("jota_user");
if(_savedUser){
  try {
    const _u = JSON.parse(_savedUser);
    document.getElementById("login-wrap").style.display = "none";
    applyRole(_u);
    init();
  } catch(e) { sessionStorage.removeItem("jota_user"); }
}
